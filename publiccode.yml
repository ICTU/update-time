description:
  en:
    shortDescription: Update-time is an automated system for updating software
      dependencies.
    longDescription: >
      Update-time scans a locally checked out source code repository and
      updates third-party dependencies. It supports Python, JavaScript and
      manifest images.
    features:
      - Shows changelogs of updates where possible.
      - Updates Python dependencies in pyproject.toml files.
      - Updates JavaScript and TypeScript  dependencies in package.json files.
      - Updates manifest images in Dockerfiles.
      - Updates manifest images in Docker composition.
      - Updates manifest images in Helm charts.
      - Updates manifest images in GitHub Action workflows.
      - Updates manifest images in CircleCI workflows.
