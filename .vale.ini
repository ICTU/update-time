StylesPath = .vale
MinAlertLevel = suggestion
Packages = proselint, Google

# `docs/README.md.in` is the README's template, and vale reads a file by its last extension, so `.in` needs mapping
# onto Markdown. Without it the template is read as plain text, code fences and inline code included.
[formats]
in = md

[*]
BasedOnStyles = Vale, proselint, Google
# Spelling needs a vocabulary of its own to say anything about this project's terms, and codespell reads the tree
# for misspellings already.
Vale.Spelling = NO
# `> [!NOTE]` is GitHub's alert syntax, which this rule reads as the word NOTE left in the text. Switching it off
# gives up its XXX, FIXME, and TODO tokens as well.
proselint.Annotations = NO
Google.Contractions = NO
Google.EmDash = NO

# README.md is generated from `docs/README.md.in`, which is checked instead.
[README.md]
BasedOnStyles =

# CODE_OF_CONDUCT.md is the Contributor Covenant, adopted word for word, so its prose is not ours to rewrite.
[CODE_OF_CONDUCT.md]
BasedOnStyles =

# CONTRIBUTING.md follows a generic contributing template, so it is not written in this project's own voice either.
[CONTRIBUTING.md]
BasedOnStyles =
