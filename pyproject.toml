[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12.0,<0.13" ]

[project]
name = "update-time"
version = "0.0.27"
readme = "README.md"
license = "Apache-2.0"
license-files = [ "LICENSE" ]
authors = [ { name = "Quality-time team", email = "quality-time@ictu.nl" } ]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3.16",
    "Topic :: Software Development",
]
dependencies = [
    "cvss==3.6",
    "packaging==26.3",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "rich==15.0.0",
    "tomlkit==0.15.1",
]
urls.Changelog = "https://github.com/ICTU/update-time/blob/main/CHANGELOG.md"
urls.Issues = "https://github.com/ICTU/update-time/issues"
urls.Repository = "https://github.com/ICTU/update-time"
scripts.update-time = "update_time.updaters.update:main"

[dependency-groups]
dev = [
    "archunitpython==1.5.0",
    "bandit==1.9.4",
    "codespell==2.4.3",
    "coverage==7.15.4",
    "fixit==2.2.1",
    "mypy==2.3.0",
    "nltk==3.10.3",
    "pip-audit==2.10.1",
    "pyproject-fmt==2.27.0",
    "ruff==0.16.2",
    "troml==0.4.1",
    "ty==0.0.69",
    "types-pyyaml==6.0.12.20260724",
    "types-requests==2.33.0.20260712",
    "unittest-xml-reporting==4.0.0",
    "vulture==2.16",
    "yamllint==1.38.0",
    "zizmor==1.29.0",
]

[tool.uv]
override-dependencies = [
    "click==8.3.3"  # PYSEC-2026-2132: No summary provided
]
exclude-newer = "7 days"  # managed by Update-time — remove this comment to prevent Update-time from changing it
exclude-newer-package = { nltk = false }  # nltk 3.10.1 blocks the imports it resolves from a project-local .venv (https://github.com/nltk/nltk/pull/3732)

[tool.ruff]
line-length = 120
src = [
    "src",
]
lint.select = [
    "ALL",
]
lint.ignore = [
    "ANN201", # https://docs.astral.sh/ruff/rules/missing-return-type-undocumented-public-function/ - too many untyped return values atm to turn this rule on
    "COM812", # https://docs.astral.sh/ruff/rules/missing-trailing-comma/ - this rule may cause conflicts when used with the ruff formatter
    "CPY001", # https://docs.astral.sh/ruff/rules/missing-copyright-notice/ - this would lead to duplication of boiler plate text
    "D203",   # https://docs.astral.sh/ruff/rules/one-blank-line-before-class/ - prevent warning: `one-blank-line-before-class` (D203) and `no-blank-line-before-class` (D211) are incompatible. Ignoring `one-blank-line-before-class`
    "D213",   # https://docs.astral.sh/ruff/rules/multi-line-summary-second-line/ - prevent warning: `multi-line-summary-first-line` (D212) and `multi-line-summary-second-line` (D213) are incompatible. Ignoring `multi-line-summary-second-line`
    "ISC001", # https://docs.astral.sh/ruff/rules/single-line-implicit-string-concatenation/ - this rule may cause conflicts when used with the ruff formatter
    "PT",     # https://docs.astral.sh/ruff/rules/#flake8-pytest-style-pt - pytest isn't used
    "TC006",  # https://docs.astral.sh/ruff/rules/runtime-cast-value/ - the rule claims it's often necessary to quote the first argument passed to cast(), but that's not the case in this code base
]
lint.per-file-ignores."tests/**" = [
    "SLF001", # https://docs.astral.sh/ruff/rules/private-member-access/ - tests assert against Logger's private message constants
]
lint.per-file-ignores."tools/fixit_rules.py" = [
    # Shapes LibCST and fixit impose: `visit_<NodeType>` method names, a visitor taking a node it doesn't read,
    # and `VALID`/`INVALID` as plain class lists.
    "ARG002",
    "N802",
    "RUF012",
]
lint.per-file-ignores."tools/vulture-whitelist.py" = [
    "ALL",
]
lint.isort.section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "tests",
    "local-folder",
]
lint.isort.sections.tests = [
    "tests",
]

[tool.codespell]
skip = "*.lock,./.git,./.venv,./build,./dist,./htmlcov,./.mypy_cache,./.ruff_cache"

[tool.pyproject-fmt]
indent = 4
keep_full_version = true  # Don't remove trailing zero's from version specifiers

[tool.mypy]
exclude = [
    "tools/vulture-whitelist.py", # Generated by `vulture --make-whitelist`: bare names, not code to check
]
overrides = [
    # The cvss package ships neither stubs nor a py.typed marker, so mypy cannot analyse it
    { module = [ "cvss.*" ], ignore_missing_imports = true },
]

[tool.ty]
src.exclude = [
    "tools/vulture-whitelist.py",
]

[tool.coverage]
run.branch = true
run.data_file = "build/.coverage"
run.dynamic_context = "test_function"
run.omit = [
    "*/.venv/*",
    "*/venv/*",
    "tools/fixit_rules.py",       # Pinned by the VALID/INVALID cases `just fixit` runs, which coverage cannot see
    "tools/vulture-whitelist.py", # Generated by `vulture --make-whitelist`: bare names, not code to run
]
run.source = [
    ".",
]
report.exclude_lines = [
    "if TYPE_CHECKING:",
    "pragma: no cover",
    "raise NotImplementedError",
]
report.fail_under = 100
report.skip_covered = true
html.directory = "build/unittest-coverage"
html.show_contexts = true
xml.output = "build/unittest-coverage.xml"

[tool.fixit]
enable = [
    "fixit.rules",        # Adding local rules to enable replaces the default, so re-enable the built-in rules explicitly
    ".tools.fixit_rules", # Local rules; the leading dot makes the module path relative to this file
]
